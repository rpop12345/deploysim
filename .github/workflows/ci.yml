name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make lint

  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/install-tool.sh') }}
      - run: make tools
      - run: make install-dev
      - run: make test-unit

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/install-tool.sh') }}
      - run: make tools
      - run: make install-dev
      - name: Validate the Release CRD
        run: KUBECONFIG=/dev/null bin/kubectl-validate crds/
      - name: Validate every example bundle
        run: |
          failed=0
          for bundle in examples/*.yaml; do
            .venv/bin/deploysim validate "$bundle" --audit-log "$RUNNER_TEMP/audit.jsonl" \
              >/dev/null || failed=1
          done
          exit "$failed"

  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make package
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push'
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  e2e:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/install-tool.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.kwok/cache
          key: kwok-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - run: make tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install the built wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install --quiet dist/*.whl pytest==9.1.1
          mv deploysim "$RUNNER_TEMP/deploysim-source"
          "$RUNNER_TEMP/wheel/bin/python" -c \
            'import deploysim; assert "site-packages" in deploysim.__file__, deploysim.__file__'
      - run: make cluster-up
      - name: Committed schemas match the cluster
        run: make schemas && git diff --exit-code schemas/
      - name: End-to-end tests against the wheel
        run: |
          "$RUNNER_TEMP/wheel/bin/pytest" -m e2e tests/e2e -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/pytest"
      - name: Demo against the wheel
        run: scripts/demo.sh
        env:
          DEPLOYSIM: ${{ runner.temp }}/wheel/bin/deploysim
          AUDIT_LOG: ${{ runner.temp }}/demo-audit.jsonl
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          for component in kube-apiserver kube-controller-manager kube-scheduler kwok-controller; do
            bin/kwokctl logs "$component" --name deploysim >"diagnostics/$component.log" 2>&1 || true
          done
          kubectl() { bin/kubectl --kubeconfig .deploysim/kubeconfig "$@"; }
          kubectl get events -A --sort-by=.lastTimestamp >diagnostics/events.txt 2>&1 || true
          kubectl get deployments,replicasets,pods,configmaps,leases,releases.deploysim.io -A \
            -o yaml >diagnostics/objects.yaml 2>&1 || true
          find "$RUNNER_TEMP" -name '*.jsonl' -exec cp --backup=numbered {} diagnostics/ \; || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-diagnostics
          path: diagnostics/
      - name: Delete the cluster
        if: always()
        run: make cluster-down

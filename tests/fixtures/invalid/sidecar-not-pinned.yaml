# A sidecar image uses a tag instead of a digest.
# expect: bundle:IMAGE_DIGEST
apiVersion: deploysim.io/v1alpha1
kind: Release
metadata:
  name: orders-api-1.1.0
spec:
  app: orders-api
  version: 1.1.0
  image: registry.example.com/orders-api@sha256:e835f580cb825259b6c27d62d2fc2d59dbee392f3e62b6e1b4b8156ee04a5685
  healthCheck:
    timeoutSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
spec:
  replicas: 3
  progressDeadlineSeconds: 45
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
        app.kubernetes.io/version: 1.1.0
    spec:
      containers:
      - name: orders-api
        image: registry.example.com/orders-api@sha256:e835f580cb825259b6c27d62d2fc2d59dbee392f3e62b6e1b4b8156ee04a5685
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
      - name: proxy
        image: envoyproxy/envoy:v1.31.0
        readinessProbe:
          tcpSocket:
            port: 9901
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
spec:
  selector:
    app.kubernetes.io/name: orders-api
  ports:
  - port: 80
    targetPort: 8080

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: releases.deploysim.io
spec:
  group: deploysim.io
  scope: Namespaced
  names:
    kind: Release
    listKind: ReleaseList
    plural: releases
    singular: release
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Attempts
          type: integer
          jsonPath: .status.attempts
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: self.metadata.name == self.spec.app + '-' + self.spec.version
              message: metadata.name must be <app>-<version>
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [app, version, image]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Release spec is immutable; publish a new version
              properties:
                app:
                  type: string
                  maxLength: 40
                  pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                version:
                  type: string
                  maxLength: 64
                  pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9a-z-]+(\.[0-9a-z-]+)*)?$
                image:
                  type: string
                  maxLength: 512
                  pattern: ^[a-z0-9]+([._-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)*@sha256:[a-f0-9]{64}$
                healthCheck:
                  type: object
                  default: {}
                  properties:
                    timeoutSeconds:
                      type: integer
                      minimum: 5
                      maximum: 600
                      default: 60
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Deploying, Verifying, Succeeded, RolledBack, RollbackFailed, Interrupted]
                attempts:
                  type: integer
                  minimum: 0
                deploymentId:
                  type: string
                message:
                  type: string
                lastTransitionTime:
                  type: string
                  format: date-time

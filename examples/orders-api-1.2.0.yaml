# orders-api 1.2.0: a broken build. The deploysim.io/fault annotation makes KWOK keep its pods
# unready, so every deploy of this release rolls back.
apiVersion: deploysim.io/v1alpha1
kind: Release
metadata:
  name: orders-api-1.2.0
spec:
  app: orders-api
  version: 1.2.0
  image: registry.example.com/orders-api@sha256:481831f87e59cbb0f72a714c794b50974dcfef9cbacf173825f9c44c012054c5
  healthCheck:
    timeoutSeconds: 60
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-config
  labels:
    app.kubernetes.io/name: orders-api
data:
  LOG_LEVEL: debug
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
spec:
  replicas: 3
  progressDeadlineSeconds: 45
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
        app.kubernetes.io/version: 1.2.0
      annotations:
        deploysim.io/fault: unhealthy
    spec:
      containers:
      - name: orders-api
        image: registry.example.com/orders-api@sha256:481831f87e59cbb0f72a714c794b50974dcfef9cbacf173825f9c44c012054c5
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: orders-api-config
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
spec:
  selector:
    app.kubernetes.io/name: orders-api
  ports:
  - port: 80
    targetPort: 8080
